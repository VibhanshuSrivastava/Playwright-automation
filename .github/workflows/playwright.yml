name: Playwright Tests

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

  workflow_dispatch:

jobs:
  verify:
    name: Lint, typecheck & build
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  test:
    needs: verify
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Pin the exact OS/browser build so screenshot baselines (tests/**/*-snapshots/)
    # render identically here as they do wherever they were generated — see
    # "Updating screenshot baselines" below for how to regenerate them to match.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start backend
        run: |
          cd app/backend
          nohup npm run dev > backend.log 2>&1 &

      - name: Wait for backend
        run: npx wait-on http://127.0.0.1:3000/api/projects

      - name: Run Playwright tests
        run: npm test --prefix playwright

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: playwright/test-results/
          retention-days: 30

      - name: Upload backend logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: app/backend/backend.log
          retention-days: 7

  # Manual trigger only (Actions tab → this workflow → Run workflow).
  # Regenerates screenshot baselines in the same container image the "test"
  # job checks against, and uploads them as a downloadable artifact — it does
  # NOT commit anything. Download the artifact, extract it over
  # playwright/tests/, and commit the changed *-snapshots/ files yourself.
  update-screenshots:
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start backend
        run: |
          cd app/backend
          nohup npm run dev > backend.log 2>&1 &

      - name: Wait for backend
        run: npx wait-on http://127.0.0.1:3000/api/projects

      - name: Update screenshot baselines
        run: npm --prefix playwright run test -- --update-snapshots

      - name: Upload updated snapshots
        uses: actions/upload-artifact@v4
        with:
          name: updated-snapshots
          path: playwright/tests/**/*-snapshots/**
          retention-days: 7
